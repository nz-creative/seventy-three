# Storybook at site root + Next.js docs under /docs/ (merged into one Pages artifact).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Docs `build:static` is not a Turbo `build` task — workspace packages must
      # have `dist/` (tokens) and built UI so Next can resolve imports.
      - name: Build workspace packages (tokens + ui)
        run: pnpm exec turbo run build --filter=@seventythree/tokens --filter=@seventythree/ui

      - name: Build Storybook
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build-storybook

      # Must use `build:static` — plain `build` does not set basePath/export and
      # will not produce `out/` for the Pages layout script.
      - name: Build docs site (static, /docs)
        env:
          DOCS_REPO_ROOT: /${{ github.event.repository.name }}
          NEXT_PUBLIC_STORYBOOK_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm --filter @seventythree/docs run build:static

      - name: Lay out docs export for Pages (if basePath is /docs only)
        run: bash scripts/layout-docs-export-for-pages.sh

      - name: Merge docs into Pages artifact
        run: |
          mkdir -p apps/storybook/storybook-static/docs
          if [[ -d apps/docs/out/docs ]]; then
            cp -r apps/docs/out/docs/. apps/storybook/storybook-static/docs/
          else
            cp -r apps/docs/out/. apps/storybook/storybook-static/docs/
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/storybook/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
