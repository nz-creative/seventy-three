name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Omit `version` — pnpm/action-setup reads `packageManager` from package.json
      # (setting both causes ERR_PNPM_BAD_PM_VERSION when they disagree).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build lint typecheck
