# Storybook at site root + Next.js docs under /docs/ (merged into one Pages artifact).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build-storybook

      - name: Build docs site (static, /docs)
        env:
          DOCS_STATIC_EXPORT: "1"
          DOCS_BASE_PATH: "/docs"
        run: pnpm --filter @seventythree/docs build

      - name: Lay out docs export for Pages (/docs/* paths)
        run: bash scripts/layout-docs-export-for-pages.sh

      - name: Merge docs into Pages artifact
        run: cp -r apps/docs/out/docs apps/storybook/storybook-static/docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/storybook/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
